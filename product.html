<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنتج | أوروكرون</title>
  <meta name="description" content="تفاصيل الساعة: المواصفات، الضمان، التقييمات، والدفع عند الاستلام.">
  <meta name="theme-color" content="#FAF6EF">
  <link rel="icon" href="assets/img/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script type="module" src="assets/js/pages/product.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
  <div id="site-header"></div>
  <main id="main" class="container">
    <div class="page-head"><nav class="breadcrumbs" id="breadcrumbs"></nav></div>
    <div class="product-layout" id="product-layout"></div>

    <section class="reviews-section" id="reviews-section">
      <div class="section-head"><h2 class="section-title display" data-i18n="product.reviews">التقييمات</h2></div>
      <div class="reviews-layout">
        <div id="reviews-list"></div>
        <div class="review-form-card">
          <h3 data-i18n="product.addReview">أضف تقييمك</h3>
          <form id="review-form" novalidate>
            <div class="field" style="margin-top:1rem">
              <label data-i18n="product.yourRating">تقييمك</label>
              <div class="rating-input" id="rating-input" role="radiogroup" aria-label="rating"></div>
            </div>
            <div class="field"><label for="review-name" data-i18n="product.reviewName"></label>
              <input id="review-name" name="author" required maxlength="60"></div>
            <div class="field"><label for="review-title" data-i18n="product.reviewTitle"></label>
              <input id="review-title" name="title" required maxlength="90"></div>
            <div class="field"><label for="review-body" data-i18n="product.reviewBody"></label>
              <textarea id="review-body" name="body" required maxlength="1200"></textarea></div>
            <button class="btn btn-gold btn-block" type="submit" data-i18n="actions.submit">إرسال</button>
          </form>
        </div>
      </div>
    </section>

    <section class="section" id="related-section">
      <div class="section-head"><h2 class="section-title display" data-i18n="product.related">قد يعجبك أيضاً</h2></div>
      <div class="product-grid" id="related-grid"></div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
