<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور | أوروكرون</title>
  <meta name="theme-color" content="#FAF6EF">
  <link rel="icon" href="assets/img/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script type="module" src="assets/js/pages/reset-password.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
  <div id="site-header"></div>
  <main id="main" class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 id="reset-title">إعادة تعيين كلمة المرور</h1>
        <p class="muted center" id="reset-lead">أدخل كلمة مرور جديدة لحسابك.</p>
        <form id="reset-form" novalidate>
          <div class="field"><label for="reset-password" data-i18n="auth.newPassword">كلمة المرور الجديدة</label>
            <input id="reset-password" name="password" type="password" dir="ltr" required autocomplete="new-password" minlength="6"></div>
          <div class="field"><label for="reset-confirm" data-i18n="auth.confirmPassword">تأكيد كلمة المرور</label>
            <input id="reset-confirm" name="confirm" type="password" dir="ltr" required autocomplete="new-password" minlength="6"></div>
          <button class="btn btn-gold btn-block" type="submit" id="reset-submit">حفظ كلمة المرور</button>
        </form>
        <p id="reset-error" class="field-error" role="alert"></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
